services:
  arch-installer-vm:
    image: qemux/qemu
    container_name: arch-installer-vm
    environment:
      # This host has no hardware virtualization (no /dev/kvm exists and the CPU
      # exposes neither VMX nor SVM). Force QEMU's software (TCG) emulation so
      # the container starts instead of aborting on the missing-kvm check.
      # Note: TCG runs roughly ~10x slower than KVM.
      KVM: "N"
      # Give the software-emulated VM more resources to compensate for TCG.
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      # Cap the VM's virtual display to 720p. We use the stdvga VGA device
      # (not virtio-vga) because only VGA/std-vga exposes xmax/ymax, which cap
      # the EDID mode list itself: without them the compositor re-reads the
      # mode list on startup and jumps to the largest advertised mode (4K),
      # as virtio-vga did. With xmax/ymax, modes above 1280x720 aren't
      # advertised at all, so GRUB, DRM, Xorg, and the compositor all stay at
      # 720p. xres/yres just mark 720p as the preferred mode. This is a VM-only
      # change; the ISO is untouched and real hardware is unaffected.
      VGA: "none"
      ARGUMENTS: "-device VGA,xres=1280,yres=720,xmax=1280,ymax=720"
    cap_add:
      - NET_ADMIN        # Required for network bridging
    devices:
      - /dev/net/tun     # Required for network bridging
    ports:
      - 8006:8006        # Exposes the Web UI
    volumes:
      # Map the built instantOS installer ISO to /boot.iso
      - ./instantos.iso:/boot.iso
      # Persistent storage for the virtual hard drive
      - ./vm-data:/storage 
    restart: on-failure
    stop_grace_period: 2m
