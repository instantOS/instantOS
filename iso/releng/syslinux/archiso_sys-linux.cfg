LABEL arch
TEXT HELP
Boot the instantOS install medium on BIOS.
It allows you to install instantOS or perform system maintenance.
ENDTEXT
MENU LABEL instantOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the instantOS install medium on BIOS with speakup screen reader.
It allows you to install instantOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL instantOS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
