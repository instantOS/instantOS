name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck and shfmt
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
          shellcheck --version
          shfmt --version

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Run Shell checks
        run: just lint
