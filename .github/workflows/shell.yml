name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck and shfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
          shellcheck --version
          shfmt --version

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Run Shell checks
        run: just lint
