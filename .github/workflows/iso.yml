name: Build & Release ISO

on:
  push:
    branches:
      - 'release'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      epoch: ${{ steps.version.outputs.epoch }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Set shared build version and check publishing configuration
        id: version
        env:
          PUBLISH: ${{ github.ref_name == 'release' || inputs.create_release }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
        run: |
          if [[ "$PUBLISH" == true && ( -z "$GITLAB_TOKEN" || -z "$GITLAB_PROJECT_ID" ) ]]; then
            echo 'Set the GITLAB_TOKEN secret and GITLAB_PROJECT_ID variable before publishing.' >&2
            exit 1
          fi
          epoch="$(date +%s)"
          {
            echo "epoch=$epoch"
            echo "version=$(date -u --date="@$epoch" +%Y.%m.%d)"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  build-offline:
    name: Build offline ISO
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: extractions/setup-just@v4
      - name: Build offline ISO
        run: just build-iso-offline
      - name: Upload offline ISO for publishing
        uses: actions/upload-artifact@v7
        with:
          name: instantos-iso-offline
          path: iso/build/iso/*-offline.iso
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build-iso:
    name: Build instantOS ISO
    needs: prepare
    runs-on: ubuntu-26.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          echo "Initial disk space:"
          df -h
          # Remove large pre-installed tools to guarantee ~30+ GB free space for archiso
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Build ISO
        run: just build-iso

      - name: Generate checksums
        run: just checksums

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v7
        with:
          name: instantos-iso-live
          path: |
            iso/build/iso/*.iso
            iso/build/iso/*.sha256
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish ISOs to GitLab and announce on GitHub
    needs: [prepare, build-iso, build-offline]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    # Serialize promotion; an older build must never replace a newer one.
    concurrency:
      group: gitlab-iso-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Test package upload and release publication
        run: python3 -m unittest discover -s iso/tests -p 'test_publish_git*.py' -v
      - name: Download verified ISOs
        uses: actions/download-artifact@v8
        with:
          pattern: instantos-iso-*
          merge-multiple: true
          path: iso/artifacts
      - name: Upload and verify GitLab package
        id: gitlab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
          ISO_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: |
          python3 iso/publish-gitlab.py \
            "iso/artifacts/instantos-${ISO_VERSION}-x86_64.iso" \
            "iso/artifacts/instantos-${ISO_VERSION}-offline.iso" \
            "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --version "$ISO_VERSION" --commit "$GITHUB_SHA" \
            --epoch "$SOURCE_DATE_EPOCH" --notes release-notes.md
      - name: Publish GitHub release with GitLab download links
        if: steps.gitlab.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 iso/publish-github.py
